name: Build custom FOCE iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D ENABLE_BITCODE=0 \
            -D PLATFORM=OS64 \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=''

      - name: Build
        run: |
          cmake --build build --config RelWithDebInfo

      - name: Package
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: foce-ios
          path: build/*.ipa
